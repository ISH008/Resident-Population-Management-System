spring:
  application:
    name: resident-management-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.population.resident.domain
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
